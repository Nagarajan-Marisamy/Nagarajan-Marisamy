<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nagarajan M - B.Tech IT student building secure software">
  <title>Nagarajan M - B.Tech IT student building secure software</title>

  <!-- ============ CONFIG (edit colours here) ============
       navy  #0a1424 / #0f2036   teal #2dd4bf   mint #86efac   amber #fbbf24
  ====================================================== -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#10253b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2dd4bf" opacity="0.12"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- circuit traces, top right -->
    <g fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M700 40 H820 L850 70 H980 L1010 40 H1200"/>
      <path d="M760 90 H860 L880 110 H1120 L1150 80 H1200"/>
      <path d="M900 20 V50"/>
      <path d="M1060 110 V150"/>
    </g>
    <g fill="#2dd4bf" fill-opacity="0.35">
      <circle cx="700" cy="40" r="4"/><circle cx="760" cy="90" r="4"/>
      <circle cx="900" cy="20" r="3"/><circle cx="1060" cy="150" r="3"/>
    </g>

    <!-- soft glow behind shield -->
    <circle cx="1020" cy="165" r="150" fill="url(#glow)">
      <animate attributeName="r" values="140;165;140" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code glyphs -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#2dd4bf" fill-opacity="0.3">
      <text x="680" y="150">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="790" y="226">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1130" y="95" fill="#fbbf24" fill-opacity="0.35">01
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.5s" repeatCount="indefinite"/>
      </text>
      <text x="1120" y="250">#!/
        <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="5.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- heartbeat line: faint track + travelling bright segment -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="ecg" d="M40 262 H250 L270 262 L286 226 L306 292 L324 240 L338 262 H520 L540 262 L556 236 L572 282 L588 262 H900 L958 262"
            stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="3"/>
      <path d="M40 262 H250 L270 262 L286 226 L306 292 L324 240 L338 262 H520 L540 262 L556 236 L572 282 L588 262 H900 L958 262"
            pathLength="1000" stroke="url(#pulse)" stroke-width="4" stroke-dasharray="180 820">
        <animate attributeName="stroke-dashoffset" from="180" to="-1000" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- shield -->
    <g transform="translate(1020 165)">
      <circle r="62" fill="none" stroke="#2dd4bf" stroke-width="2">
        <animate attributeName="r" values="62;120" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -78 L62 -52 V8 C62 52 30 74 0 88 C-30 74 -62 52 -62 8 V-52 Z"
            fill="#0a1424" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0 -62 L48 -42 V6 C48 40 24 58 0 70 C-24 58 -48 40 -48 6 V-42 Z"
            fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5"/>
      <!-- lock -->
      <rect x="-20" y="-6" width="40" height="34" rx="6" fill="#fbbf24"/>
      <path d="M-12 -6 V-18 A12 12 0 0 1 12 -18 V-6" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="5" fill="#0a1424"/>
      <rect x="-2" y="10" width="4" height="10" rx="2" fill="#0a1424"/>
    </g>

    <!-- name + tagline -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="52" y="72" font-size="18" font-family="Consolas, 'Courier New', monospace" fill="#fbbf24" letter-spacing="3">&gt; hello, world. i'm</text>
      <text x="48" y="150" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="2">NAGARAJAN M</text>
      <rect x="52" y="168" width="120" height="5" rx="2.5" fill="#fbbf24">
        <animate attributeName="width" values="40;260;40" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- rotating tagline -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#e2e8f0">
      <text x="52" y="212">B.Tech IT &#183; building secure, practical software
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.31;0.34;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="52" y="212" opacity="0">Java &#183; Python &#183; C &#183; SQL
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.34;0.64;0.67;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="52" y="212" opacity="0">ESP32 circuits &#8594; Java security tools
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.67;0.97;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- border -->
    <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="3"/>
  </g>
</svg>
